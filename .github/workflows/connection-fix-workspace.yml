name: Connection fix workspace
on:
  push:
    branches: [work/connection-login-validation]
permissions:
  contents: write
concurrency:
  group: connection-fix-workspace
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - name: Prepare and validate correction
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/_connection_fix_refinements.py
      - name: Preserve synthetic UI validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connection-fix-ui-evidence
          path: build/ui-connections-*.png
          if-no-files-found: warn
          retention-days: 7
