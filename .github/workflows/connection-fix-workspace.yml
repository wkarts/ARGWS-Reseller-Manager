name: Connection fix workspace
on:
  push:
    branches: [work/connection-login-validation]
permissions:
  contents: write
concurrency:
  group: connection-fix-workspace
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - name: Prepare and validate correction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/_prepare_connection_fix.py')
          text=p.read_text(encoding='utf-8')
          old="tree=api('/git/trees', {'base_tree':'01b9f56b3557cf566bba0d517cbab3b6fa40f687', 'tree':entries})"
          assert old in text
          text=text.replace(old,"print('TESTED_PRODUCT_ENTRIES=' + json.dumps(entries)); tree={'sha':'publish-with-connected-github-tool'}")
          needle='run: python -m playwright install --with-deps chromium'
          assert text.count(needle)==1
          # Native Windows builds already run Chromium without installing Server features.
          expression='$' + '{{ runner.os == '+repr('Linux')+' && '+repr('--with-deps')+' || '+repr('')+' }}'
          text=text.replace(needle,'timeout-minutes: 3\n        run: python -m playwright install '+expression+' chromium')
          p.write_text(text,encoding='utf-8')
          PY
          python scripts/_connection_fix_refinements.py
      - name: Preserve synthetic UI validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connection-fix-ui-evidence
          path: build/ui-connections-*.png
          if-no-files-found: warn
          retention-days: 7
