name: Validate
on:
  pull_request:
  push:
    branches: [main, develop]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: node frontend/build.mjs --check
      - run: node --test tests/frontend-build.test.mjs
      - run: python -m compileall -q app packaging scripts
      - run: python -m pytest -q --junitxml=build/test-results.xml
      - run: python scripts/smoke_runtime.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}
          path: build/test-results.xml
          retention-days: 7
  container:
    needs: tests
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml
    with:
      # PR and manual validation never publish; only trusted push events do.
      publish: ${{ github.event_name == 'push' }}
  windows:
    needs: tests
    permissions:
      contents: read
    uses: ./.github/workflows/windows.yml
  release:
    needs: [tests, container, windows]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: reseller-manager-*
          path: release-assets
          merge-multiple: true
      - name: Publish release only after complete native validation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          python -m scripts.publish_release --artifacts release-assets
